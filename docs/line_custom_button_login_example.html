<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE 第三方登入 WS 範例</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #151515;
      color: #f5f5f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(780px, 100%);
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    label {
      display: grid;
      gap: 6px;
      color: #d4d4d4;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #262626;
      color: #f5f5f5;
      padding: 10px 12px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    #connectWsButton {
      background: #52525b;
      color: #fff;
    }

    #loginButton {
      background: #06c755;
      color: #07130b;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .note {
      margin: 0;
      color: #a3a3a3;
      line-height: 1.6;
      font-size: 13px;
    }

    pre {
      min-height: 240px;
      max-height: 440px;
      overflow: auto;
      margin: 0;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #0a0a0a;
      color: #d4d4d4;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>LINE 第三方登入 WS 範例</h1>

    <label>
      LINE Channel ID
      <input id="channelIdInput" autocomplete="off" spellcheck="false" placeholder="請填入 LINE Channel ID">
    </label>

    <label>
      OAuth 權限範圍
      <input id="scopeInput" autocomplete="off" spellcheck="false" value="openid profile email">
    </label>

    <label>
      LINE Console Callback URL / Redirect URI
      <input id="redirectUriInput" autocomplete="off" spellcheck="false">
    </label>

    <label>
      WebSocket 連線網址
      <input id="wsUrlInput" autocomplete="off" spellcheck="false">
    </label>

    <p class="note">
      請用 http/https 開啟這個檔案，並把完全相同的 Redirect URI 加到 LINE Login channel 的 Callback URL。
      popup 登入完成後會導回同一個檔案，把 authorization code 傳回主視窗，再由主視窗送
      <code>line_login</code> 到遊戲 WebSocket。後端會用 <code>LINE_CHANNEL_SECRET</code> 換 token 並驗證 nonce。
    </p>

    <div class="actions">
      <button id="connectWsButton" type="button">連線 WS</button>
      <button id="loginButton" type="button" disabled>使用 LINE 登入</button>
    </div>

    <pre id="logOutput"></pre>
  </main>

  <script>
    const PROVIDER = "line";
    const WS_TYPE = "line_login";
    const DEFAULT_CHANNEL_ID = "2010421378";
    const DEFAULT_WS_URL = location.protocol === "https:"
      ? `wss://${location.host}`
      : "ws://127.0.0.1:8787";

    const params = new URLSearchParams(location.search);
    const channelIdInput = document.querySelector("#channelIdInput");
    const scopeInput = document.querySelector("#scopeInput");
    const redirectUriInput = document.querySelector("#redirectUriInput");
    const wsUrlInput = document.querySelector("#wsUrlInput");
    const connectWsButton = document.querySelector("#connectWsButton");
    const loginButton = document.querySelector("#loginButton");
    const logOutput = document.querySelector("#logOutput");

    let socket = null;

    function defaultRedirectUri() {
      if (!location.origin || location.origin === "null") {
        return "";
      }
      const url = new URL(location.href);
      url.search = "";
      url.hash = "";
      return url.href;
    }

    function log(message, data) {
      const time = new Date().toLocaleTimeString();
      const text = data === undefined ? message : `${message}\n${JSON.stringify(data, null, 2)}`;
      logOutput.textContent += `[${time}] ${text}\n\n`;
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function postOAuthCallbackIfNeeded() {
      const code = params.get("code");
      const error = params.get("error");
      if (!window.opener || (!code && !error)) {
        return false;
      }

      window.opener.postMessage({
        source: "game-oauth-callback",
        provider: PROVIDER,
        code,
        state: params.get("state"),
        error,
        error_description: params.get("error_description"),
      }, location.origin);
      window.close();
      return true;
    }

    if (!postOAuthCallbackIfNeeded()) {
      channelIdInput.value = params.get("channel_id") || DEFAULT_CHANNEL_ID;
      scopeInput.value = params.get("scope") || scopeInput.value;
      redirectUriInput.value = params.get("redirect_uri") || defaultRedirectUri();
      wsUrlInput.value = params.get("ws") || DEFAULT_WS_URL;
      log("已就緒", { redirect_uri: redirectUriInput.value, ws_type: WS_TYPE });
    }

    function connectWebSocket() {
      const wsUrl = wsUrlInput.value.trim();
      if (!wsUrl) {
        log("請填入 WebSocket 連線網址");
        return;
      }
      if (socket && socket.readyState === WebSocket.OPEN) {
        log("WS 已連線");
        return;
      }

      loginButton.disabled = true;
      socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        log("WS 已連線", { wsUrl });
        loginButton.disabled = false;
      });
      socket.addEventListener("message", (event) => {
        try {
          log("收到 WS 訊息", JSON.parse(event.data));
        } catch (_) {
          log("收到 WS 訊息", event.data);
        }
      });
      socket.addEventListener("close", (event) => {
        log("WS 已關閉", { code: event.code, reason: event.reason });
        loginButton.disabled = true;
      });
      socket.addEventListener("error", () => log("WS 發生錯誤"));
    }

    function randomHex(byteLength) {
      const bytes = new Uint8Array(byteLength);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    }

    function openOAuthPopup() {
      const channelId = channelIdInput.value.trim();
      const redirectUri = redirectUriInput.value.trim();
      if (!channelId) {
        log("請填入 LINE Channel ID");
        return;
      }
      if (!redirectUri) {
        log("請填入 Redirect URI，並用 http/https 開啟此頁");
        return;
      }

      const state = randomHex(16);
      const nonce = randomHex(16);
      sessionStorage.setItem(`${PROVIDER}:oauth_state`, state);
      sessionStorage.setItem(`${PROVIDER}:nonce`, nonce);

      const authUrl = new URL("https://access.line.me/oauth2/v2.1/authorize");
      authUrl.searchParams.set("response_type", "code");
      authUrl.searchParams.set("client_id", channelId);
      authUrl.searchParams.set("redirect_uri", redirectUri);
      authUrl.searchParams.set("scope", scopeInput.value.trim() || "openid profile email");
      authUrl.searchParams.set("state", state);
      authUrl.searchParams.set("nonce", nonce);

      window.open(authUrl.toString(), "line_oauth", "popup,width=540,height=720");
      log("已開啟 LINE OAuth popup", { redirect_uri: redirectUri, scope: scopeInput.value.trim() });
    }

    function sendLoginCode(code) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log(`WS 尚未連線，無法送出 ${WS_TYPE}`);
        return;
      }

      const payload = {
        type: WS_TYPE,
        data: {
          code,
          redirect_uri: redirectUriInput.value.trim(),
          nonce: sessionStorage.getItem(`${PROVIDER}:nonce`) || "",
        },
      };
      socket.send(JSON.stringify(payload));
      log(`已送出 ${WS_TYPE}`, {
        ...payload,
        data: { ...payload.data, code: `${code.slice(0, 12)}...` },
      });
      sessionStorage.removeItem(`${PROVIDER}:nonce`);
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) {
        return;
      }
      const data = event.data || {};
      if (data.source !== "game-oauth-callback" || data.provider !== PROVIDER) {
        return;
      }
      const expectedState = sessionStorage.getItem(`${PROVIDER}:oauth_state`);
      if (!data.state || data.state !== expectedState) {
        log("OAuth state 驗證不一致", { expectedState, receivedState: data.state });
        return;
      }
      sessionStorage.removeItem(`${PROVIDER}:oauth_state`);
      if (data.error) {
        log("OAuth 登入失敗", data);
        return;
      }
      if (!data.code) {
        log("OAuth callback 缺少 authorization code", data);
        return;
      }
      sendLoginCode(String(data.code));
    });

    connectWsButton.addEventListener("click", connectWebSocket);
    loginButton.addEventListener("click", openOAuthPopup);
  </script>
</body>
</html>
